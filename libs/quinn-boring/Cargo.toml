[package]
name = "quinn-boring"
version = "0.1.0"
edition = "2021"
description = "BoringSSL crypto provider for quinn (vendored from quinn-btls, adapted to boring 5)"
license = "MIT OR Apache-2.0"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["quinn/runtime-tokio"]
boring = []

[dependencies]
boring = { version = "5", features = ["pq-experimental"] }
boring-sys = "5"
bytes = "1"
foreign-types-shared = "0.3"
lru = "0.16"
quinn = { version = "0.11", default-features = false }
quinn-proto = { version = "0.11", default-features = false }
rand = "0.8"
hex = "0.4"
tracing = "0.1"
once_cell = "1"
tempfile = "3"
