[access_log]
enable = true
level = "info"
realtime = false

[admin]
realm = "diff_merge_test"
path = "/__admin"

# 测试配置必须带管理员账号：所有测试脚本（dns_smoke.sh / dns_verify.sh /
# acceptance_test_ports.sh 的 geoip 校验）都用 -u admin:admin 打
# /__admin/api/*。此前这里只有 realm、没有 [[admin.users]]，而 admin 面板
# 在「没有配置用户」时是**关闭**的（basic_auth::check_admin_headers 返回
# false 并告警），于是这些检查全部 401。口令与 config.toml 的样例一致。
[[admin.users]]
username = "admin"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$E/RLobwgix2BWMRMT++urA$yEympjJtiDh0ezwSQsnkbsfYAoSzeDAHYw3EsUMBsj4"  # sample password: admin

[dns]
axfr_out_acl = ["127.0.0.0/8"]
enabled = true
listen_addr = "any"
recursion_acl = ["0.0.0.0/0"]
# 测试配置必须开 test_mode：端口派生才落到 5353/1953/11853，
# 而不是生产的 53/953/853。关掉的话这份「测试配置」会去绑生产端口，
# 与 scripts/acceptance_test_ports.sh、dns_smoke.sh、dns_verify.sh
# 全部「绝不碰 53/853」的前提矛盾（且与在跑的生产实例直接冲突）。
test_mode = true

# ECH 的发现路径只有 DNS：这条记录让客户端解析 echo.test 时拿到 ech= 参数。
[[dns.https_rr]]
name = "echo.test"
alpn = "h2,h3"
port = 18443
ech = true

[dns.dnssec]
algorithm = "ECDSAP256SHA256"
enabled = true
ksk_lifetime_days = 365
nsec3 = true
nsec3_iterations = 0
rotation_days = 30
rotation_enabled = true

[dns.doh]
enabled = true
hostnames = []
path = "/dns-query"

[dns.dot]
cert = "cert.pem"
enabled = true
key = "key.pem"
# 写死 11853：显式端口会盖过 test_mode 的派生（0 → 853 / test_mode 11853），
# 之前写 853 让这份测试配置去绑生产 DoT 口，和在生产实例并存时直接 bind 失败。
port = 11853

[dns.geo]
enabled = true

[[dns.geo.lines]]
cidrs = ["192.0.2.0/24"]
name = "lab-a"

[[dns.geo.lines]]
cidrs = ["198.51.100.0/24"]
name = "lab-b"

[dns.modes]
authoritative = true
recursive = true
root = true

[dns.rootzone]
enabled = false

[[dns.rpz]]
name = "blocked.crucible.test"
rtype = "nxdomain"
value = ""

[[dns.rpz]]
name = "www.crucible.test"
rtype = "A"
value = "192.0.2.88"

[geoip]
db_path = "data/geoip/current/geoip.sqlite"
enabled = true

[ip_access]
allow = []
deny = []

[[listeners]]
address = "0.0.0.0"
address_v6 = "::"
# 不要在这里设 port_reuse：h1 对「port_reuse 且无 TLS」的 listener 一律
# 301 到 https://{server_name}/（早期规格 5；明文口要有 TLS 兄弟才说得通）。
# 19095 没有 TLS 兄弟，于是**所有明文请求都变成 301 "moved to https"**——
# 应用冒烟、wrk/bench、dns_smoke.sh / dns_verify.sh 以及 acceptance 的 geoip
# 查询全部打在跳转上，测到的不是应用响应。生产 config.toml 本就没有 port_reuse；
# 真正需要复用的是 55555/55556（l4_forward 那对）。
autoindex = true
file_open = [
    "/php/demo.php=preview",
    "pdf=preview",
    "zip=download",
    "php=execute",
]
http_versions = [
    "h1",
    "h2",
]
port = 19095
root = "www-apps"
server_name = "apps-test.crucible.local"


[[listeners.apps]]
docroot = "www-apps/php"
enabled = true
engine = "php"
extensions = [
    "php",
    "",
]
index = "index.php"
paths = ["/php"]
workers = 16

[[listeners.apps]]
docroot = "www-apps/rust"
