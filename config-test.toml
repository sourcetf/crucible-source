[access_log]
enable = true
level = "info"
realtime = false

[admin]
realm = "diff_merge_test"

[dns]
axfr_out_acl = ["127.0.0.0/8"]
enabled = true
listen_addr = "any"
recursion_acl = ["0.0.0.0/0"]
test_mode = false

[dns.dnssec]
algorithm = "ECDSAP256SHA256"
enabled = true
ksk_lifetime_days = 365
nsec3 = true
nsec3_iterations = 0
rotation_days = 30
rotation_enabled = true

[dns.doh]
enabled = true
hostnames = []
path = "/dns-query"

[dns.dot]
cert = "cert.pem"
enabled = true
key = "key.pem"
port = 853

[dns.geo]
enabled = true

[[dns.geo.lines]]
cidrs = ["192.0.2.0/24"]
name = "lab-a"

[[dns.geo.lines]]
cidrs = ["198.51.100.0/24"]
name = "lab-b"

[dns.modes]
authoritative = true
recursive = true
root = true

[dns.rootzone]
enabled = false

[[dns.rpz]]
name = "blocked.crucible.test"
rtype = "nxdomain"
value = ""

[[dns.rpz]]
name = "www.crucible.test"
rtype = "A"
value = "192.0.2.88"

[geoip]
db_path = "data/geoip/current/geoip.sqlite"
enabled = true

[ip_access]
allow = []
deny = []

[[listeners]]
address = "0.0.0.0"
address_v6 = "::"
port_reuse = true
autoindex = true
file_open = [
    "/php/demo.php=preview",
    "pdf=preview",
    "zip=download",
    "php=execute",
]
http_versions = [
    "h1",
    "h2",
]
port = 19095
root = "www-apps"
server_name = "apps-test.crucible.local"

[[listeners.apps]]
docroot = "www-apps/php"
enabled = true
engine = "php"
extensions = [
