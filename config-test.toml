[[listeners]]
address = "0.0.0.0"
address_v6 = "::"
# 同 19095：明文静态口也不能带 port_reuse，否则每个请求都是 301。
autoindex = true
http_versions = [
    "h1",
    "h2",
]
port = 19081
root = "www-static-fair"
server_name = "fair-plain-test.crucible.local"
status_path = "/__status"

[[listeners]]
address = "0.0.0.0"
address_v6 = "::"
port_reuse = true
autoindex = true
http_versions = [
    "h1",
    "h2",
]
port = 19445
root = "www-static-fair-tls12"
server_name = "fair-tls12-test.crucible.local"

[listeners.ssl]
cert = "cert.pem"
enable_nss = true
enable_tomcrypt = true
key = "key.pem"
prefer_tls13 = false
versions = ["TLSv1.2"]

[[listeners]]
address = "0.0.0.0"
address_v6 = "::"
port_reuse = true
autoindex = true
http_versions = [
    "h1",
    "h2",
]
port = 19446
root = "www-static-fair-tls13"
server_name = "fair-tls13-test.crucible.local"

[listeners.ssl]
cert = "cert.pem"
key = "key.pem"
prefer_tls13 = true
versions = [
    "TLSv1.2",
    "TLSv1.3",
]

[[listeners]]
address = "0.0.0.0"
address_v6 = "::"
port_reuse = true
http_versions = [
    "h1",
    "h2",
    "h3",
]
port = 18443
root = "www"
server_name = "prod-test.crucible.local"

[listeners.autoindex]
enabled = true
enable_upload = true
paths = ["/"]

[listeners.ssl]
cert = "cert.pem"
cert_ec = "cert_ec.pem"
ech = true
ech_keys = "state/ech/ech_keys.pem"
enable_nss = true
enable_tomcrypt = true
key = "key.pem"
key_ec = "key_ec.pem"
pqc = true
prefer_tls13 = true

[[listeners]]
address = "0.0.0.0"
address_v6 = "::"
port_reuse = true
http_versions = [
    "h1",
    "h2",
    "h3",
]
# DoH + ECH listener（www-doh）。端口原为 8443 —— 那是**生产** TLS 口：
# 在跑着生产实例的机器上，这份测试配置必然 bind 失败，
# 而所有测试脚本都写着「NEVER use 8443」。改到 18444。
port = 18444
root = "www-doh"
server_name = "crucible.local"

[listeners.autoindex]
enabled = true
paths = ["/"]

[listeners.ssl]
cert = "cert.pem"
cert_ec = "cert_ec.pem"
ech = true
ech_keys = "state/ech/ech_keys.pem"
key = "key.pem"
key_ec = "key_ec.pem"
pqc = true
prefer_tls13 = true

[[listeners]]
address = "0.0.0.0"
address_v6 = "::"
port_reuse = true
l4_forward = "127.0.0.1:55556"
port = 55555
root = "www-static-fair"

[[listeners]]
address = "0.0.0.0"
address_v6 = "::"
port_reuse = true
http_versions = ["h1"]
port = 55556
root = "state/l4auto"

[listeners.autoindex]
enabled = true
paths = ["/"]

[telemetry]
enabled = true
path = "/__metrics"
