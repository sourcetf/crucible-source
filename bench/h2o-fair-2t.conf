# h2o 公平基准配置（**线程对齐版**）：num-threads: 2 与 crucible 的
# tokio worker_threads=2（规格 §5 的 benchmark 形态）对齐 CPU 预算。
# 用于「同 CPU 预算」的公平对比；默认线程版见 h2o-fair.conf。
#
# 启动：LD_LIBRARY_PATH=/usr/local/lib/eopenssl35 \
#         /build/h2o-2.2.6/build-ossl/h2o -c /crucible/bench/h2o-fair-2t.conf

num-threads: 2

hosts:
  "fair-plain":
    listen:
      port: 9082
    paths:
      "/":
        file.dir: /crucible/www-static-fair

  "fair-tls":
    listen:
      port: 9447
      ssl:
        certificate-file: /crucible/cert.pem
        key-file: /crucible/key.pem
        minimum-version: TLSv1.2
        maximum-version: TLSv1.3
    paths:
      "/":
        file.dir: /crucible/www-static-fair
