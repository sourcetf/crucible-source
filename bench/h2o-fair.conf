# h2o 公平基准配置（规格 §5/§22 双门禁）
#
# 端口对应（生产配置 config.toml 的公平口）：
#   crucible plain :9081   / tls12 :9445 / tls13 :9446
#   h2o      plain :9082   / tls   :9447（1.2+1.3）/ tls12 :9448（仅 1.2）
#
# 启动（OpenBSD 上 h2o 用 ports 的 openssl 3.5 编译，需要 LD_LIBRARY_PATH）：
#   LD_LIBRARY_PATH=/usr/local/lib/eopenssl35 \
#     /build/h2o-2.2.6/build-ossl/h2o -c /crucible/bench/h2o-fair.conf
#
# 两边服务的 docroot **完全一致**（www-static-fair），且都服务 index.html，
# 否则比的不是同一个响应体。

hosts:
  "fair-plain":
    listen:
      port: 9082
    paths:
      "/":
        file.dir: /crucible/www-static-fair

  "fair-tls":
    listen:
      port: 9447
      ssl:
        certificate-file: /crucible/cert.pem
        key-file: /crucible/key.pem
        minimum-version: TLSv1.2
        maximum-version: TLSv1.3
    paths:
      "/":
        file.dir: /crucible/www-static-fair

  "fair-tls12":
    listen:
      port: 9448
      ssl:
        certificate-file: /crucible/cert.pem
        key-file: /crucible/key.pem
        minimum-version: TLSv1.2
        maximum-version: TLSv1.2
    paths:
      "/":
        file.dir: /crucible/www-static-fair
