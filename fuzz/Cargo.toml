[package]
name = "crucible-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[package.metadata]
cargo-fuzz = true

[lib]
name = "crucible_fuzz"
path = "src/lib.rs"
# 生产源码用 include! 编进来，文件的 `#[cfg(test)] mod tests` 会跟着进来；
# 那些测试引用完整 crate 的 config 类型，在 fuzz crate 里没有对应桩。
# 本 crate 不做单测（fuzz target 本身就是驱动），关掉 lib test/doctest。
test = false
doctest = false

[dependencies]
libfuzzer-sys = "0.4"
anyhow = "1"
bytes = "1"
http = "1"
http-body-util = "0.1"
httpdate = "1"
httparse = "1"
hyper = "1"
libc = "0.2"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "h1fast"
path = "fuzz_targets/h1fast.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qmux_proto"
path = "fuzz_targets/qmux_proto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_wire"
path = "fuzz_targets/dns_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upload_path"
path = "fuzz_targets/upload_path.rs"
test = false
doc = false
bench = false

[workspace]
