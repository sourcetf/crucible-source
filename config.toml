# 公平对比 plain-h1/h2
[[listeners]]
address = "0.0.0.0"
port = 9081
root = "www-static-fair"
autoindex = true
http_versions = ["h1", "h2"]
server_name = "fair-plain.crucible.local"

# 公平 TLS1.2
[[listeners]]
address = "0.0.0.0"
port = 9445
root = "www-static-fair-tls12"
autoindex = true
http_versions = ["h1", "h2"]
server_name = "fair-tls12.crucible.local"
ssl = { cert = "cert.pem", key = "key.pem", prefer_tls13 = false, versions = ["TLSv1.2"] }

# 公平 TLS1.3
[[listeners]]
address = "0.0.0.0"
port = 9446
root = "www-static-fair-tls13"
autoindex = true
http_versions = ["h1", "h2"]
server_name = "fair-tls13.crucible.local"
ssl = { cert = "cert.pem", key = "key.pem", prefer_tls13 = true, versions = ["TLSv1.3"] }

# 生产示例 :8443
[[listeners]]
address = "0.0.0.0"
port = 8443
root = "www"
autoindex = { enabled = true, paths = [] }
http_versions = ["h1", "h2", "h3"]
server_name = "prod.crucible.local"
ssl = { cert = "cert.pem", key = "key.pem", cert_ec = "cert_ec.pem", key_ec = "key_ec.pem", prefer_tls13 = true, pqc = true, ech = true, ech_keys = "state/ech/ech_keys.pem", enable_nss = true, enable_tomcrypt = true }

# ============ DNS 模块（bind9/named 自守护） ============
[dns]
enabled = true
test_mode = false
listen_addr = "0.0.0.0"
port = 53          # test_mode 下取 5353
rndc_port = 953     # test_mode 下取 1953

[dns.modes]
root = false
recursive = true
authoritative = true

[dns.dnssec]
enabled = true
algorithm = "ECDSAP256SHA256"
rotation_enabled = true
rotation_days = 30
ksk_lifetime_days = 365

[[dns.rpz]]
name = "*.ads.example.com"
rtype = "nxdomain"
value = ""

[dns.geo]
enabled = true
lines = []

[dns.dot]
enabled = true
port = 53          # test_mode 下 11853

[dns.doh]
enabled = true
path = "/dns-query"
hostnames = []

[dns.rootzone]
enabled = true
axfr_servers = ["198.133.219.4", "2001:503:ba3e::2:30"]
refresh_hours = 24
