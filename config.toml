[access_log]
enable = true
level = "info"
realtime = false

# 应用引擎的进程级沙箱（OpenBSD `unveil`/`pledge`/`chroot`）。
#
# 这里是**全局默认**（不写也生效）；每个 `[[listeners.apps]]` 可加自己的
# `[listeners.apps.sandbox]` 覆盖。默认行为：把引擎子进程的文件系统视图收缩到
# 「本应用 docroot（只读 `rx`）+ 本应用状态目录 + 本应用临时目录 + 解释器库」，
# 并把系统调用集合收缩到 web 应用口径（默认**不含 `exec`**：RCE 拿不到 shell）。
#
# 真机实测（`/php/sandbox-probe.php`）：读 `/etc/passwd`、读 `/etc/ssl/private`、
# 往 docroot 外写、**往 docroot 内新建 php 文件**、覆盖已有文件、`shell_exec`
# 全部被挡；只有「自己目录内读写」与出网仍可用（出网是 web 应用刚需，走 `inet`）。
#
# 非 OpenBSD 平台没有这两个系统调用，整套机制是 no-op（日志写 `active_here=false`）。
[sandbox]
enabled = true
# 上传/缓存类应用要写自己的 docroot（默认连 create 都不给 —— 那是 RCE 丢 webshell
# 做持久化的路径）：给该应用开 `docroot_rw = true`，或只放开某个目录：
# extra_unveil = ["/var/uploads:rwxc"]
# 覆盖承诺集（填 "none" = 只 unveil 不 pledge）；需要 shell out 的应用才加 exec：
# pledge = "..."
# allow_exec = false
# 把 worker 关进 docroot（FPM 原生 chroot，需应用自包含、不引用 docroot 外路径）：
# chroot = "docroot"

[admin]
path = "/__admin"
realm = "WebServer Admin"
# 管理面只在 TLS 口（8443）暴露。为空（旧行为）时 `listeners_allow` 覆盖**所有** listener，
# 其中曾包含明文的应用口 9095（地址 0.0.0.0）—— 等于把管理员口令摊在明文上传输。
# 该明文口已于 2026-11-06 移除（18 条应用路由一并迁到 8443 TLS），所以现在白名单只剩
# 8443；保留 `listeners_allow` 是为了**将来新增 listener 时管理面不会自动暴露**。
# 白名单外的端口上 admin 路径回 **404**（不是 401 —— 401 会弹出浏览器 Basic 口令框，
# 把界面变成一个凭据输入面）。h1/h2/h3 三协议同语义。
listeners_allow = [8443]

[[admin.users]]
password_hash = ""  # 生产值不入库（本仓库是公开的）。设置方式：面板 POST /__admin/api/password，或见 OPERATOR-TODO.md B 项
username = "admin"

[dns]
enabled = true
listen_addr = "0.0.0.0"
port = 53
rndc_port = 953
test_mode = false

[dns.dnssec]
algorithm = "ECDSAP256SHA256"
enabled = true
ksk_lifetime_days = 365
rotation_days = 30
rotation_enabled = true

[dns.doh]
enabled = true
hostnames = []
path = "/dns-query"

[dns.dot]
cert = "cert.pem"
enabled = true
key = "key.pem"
port = 53

[dns.geo]
enabled = true
lines = []

[dns.modes]
authoritative = true
recursive = true
root = false

[dns.rootzone]
axfr_servers = [
    "198.133.219.4",
    "2001:503:ba3e::2:30",
]
enabled = true
refresh_hours = 24

[[dns.rpz]]
name = "*.ads.example.com"
rtype = "nxdomain"
value = ""

[geoip]
db_path = "data/geoip/current/geoip.sqlite"
enabled = true

[ip_access]
allow = []
deny = []

[[listeners]]
address = "0.0.0.0"
autoindex = true
http_versions = [
    "h1",
    "h2",
]
port = 9081
root = "www-static-fair"
server_name = "fair-plain.crucible.local"

[[listeners]]
address = "0.0.0.0"
autoindex = true
http_versions = [
    "h1",
    "h2",
]
port = 9445
root = "www-static-fair-tls12"
server_name = "fair-tls12.crucible.local"

[listeners.ssl]
cert = "cert.pem"
key = "key.pem"
prefer_tls13 = false
versions = ["TLSv1.2"]

[[listeners]]
address = "0.0.0.0"
autoindex = true
http_versions = [
    "h1",
    "h2",
]
port = 9446
root = "www-static-fair-tls13"
server_name = "fair-tls13.crucible.local"

[listeners.ssl]
cert = "cert.pem"
key = "key.pem"
prefer_tls13 = true
versions = ["TLSv1.3"]

[[listeners]]
address = "0.0.0.0"
file_open = [
    "/php/demo.php=preview",
    "pdf=preview",
    "zip=download",
    "php=execute",
]
http_versions = [
    "h1",
    "h2",
    "h3",
]
port = 8443
root = "www"
server_name = "prod.crucible.local"

[listeners.autoindex]
enabled = true
paths = []

[listeners.ssl]
cert = "state/ech/real.pem"
cert_ec = "state/ech/real_ec.pem"
ech = true
ech_cover_cert = "state/ech/cover.pem"
ech_cover_cert_ec = "state/ech/cover_ec.pem"
ech_cover_key = "state/ech/cover.key.pem"
ech_cover_key_ec = "state/ech/cover_ec.key.pem"
ech_keys = "state/ech/ech_keys.pem"
ech_public_name = "crucible.local"
enable_nss = true
enable_tomcrypt = true
key = "state/ech/real.key.pem"
key_ec = "state/ech/real_ec.key.pem"
pqc = true
prefer_tls13 = true

[[listeners.apps]]
docroot = "www-apps/php"
enabled = true
engine = "php"
extensions = [
    "php",
    "",
]
index = "index.php"
paths = ["/php"]
