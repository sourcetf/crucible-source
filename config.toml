# Crucible — §18 对齐样例配置

[admin]
realm = "WebServer Admin"
path = "/__admin"

[[admin.users]]
username = "admin"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$E/RLobwgix2BWMRMT++urA$yEympjJtiDh0ezwSQsnkbsfYAoSzeDAHYw3EsUMBsj4"  # sample password: admin — change immediately

[access_log]
enable = true
level = "info"
realtime = false

[ip_access]
allow = []
deny = []

[geoip]
enabled = true
db_path = "data/geoip/current/geoip.sqlite"

[telemetry]
enabled = true
path = "/__metrics"

# 应用引擎样例 :9095
[[listeners]]
address = "0.0.0.0"
port = 9095
root = "www-apps"
autoindex = true
http_versions = ["h1", "h2"]
server_name = "apps.crucible.local"
file_open = [
  "/php/demo.php=preview",
  "pdf=preview",
  "zip=download",
  "php=execute",
]

[[listeners.apps]]
paths = ["/php"]
enabled = true
engine = "php"
extensions = ["php", ""]
workers = 16
docroot = "www-apps/php"
index = "index.php"

[[listeners.apps]]
paths = ["/rust"]
enabled = true
engine = "rust"
extensions = ["rs", ""]
lib = "target/app-engines/libapp_rust.so"
docroot = "www-apps/rust"

[[listeners.apps]]
paths = ["/c"]
enabled = true
engine = "c"
lib = "target/app-engines/libapp_c.so"
docroot = "www-apps/c"

[[listeners.apps]]
paths = ["/go"]
enabled = true
engine = "go"
# Linux: libapp_go.so (c-shared FFI). OpenBSD: missing .so is OK -- go_shm_ipc + go-shm-server.
lib = "target/app-engines/libapp_go.so"
docroot = "www-apps/go"

[[listeners.apps]]
paths = ["/lua"]
enabled = true
engine = "lua"
lib = "target/app-engines/libapp_lua.so"
docroot = "www-apps/lua"

[[listeners.apps]]
