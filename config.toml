[access_log]
enable = true
level = "info"
realtime = false

[admin]
path = "/__admin"
realm = "WebServer Admin"

[[admin.users]]
password_hash = ""  # 生产值不入库（本仓库是公开的）。设置方式：面板 POST /__admin/api/password，或见 OPERATOR-TODO.md B 项
username = "admin"

[dns]
enabled = true
listen_addr = "0.0.0.0"
port = 53
rndc_port = 953
test_mode = false

[dns.dnssec]
algorithm = "ECDSAP256SHA256"
enabled = true
ksk_lifetime_days = 365
rotation_days = 30
rotation_enabled = true

[dns.doh]
enabled = true
hostnames = []
path = "/dns-query"

[dns.dot]
cert = "cert.pem"
enabled = true
key = "key.pem"
port = 53

[dns.geo]
enabled = true
lines = []

[dns.modes]
authoritative = true
recursive = true
root = false

[dns.rootzone]
axfr_servers = [
    "198.133.219.4",
    "2001:503:ba3e::2:30",
]
enabled = true
refresh_hours = 24

[[dns.rpz]]
name = "*.ads.example.com"
rtype = "nxdomain"
value = ""

[geoip]
db_path = "data/geoip/current/geoip.sqlite"
enabled = true

[ip_access]
allow = []
deny = []

[[listeners]]
address = "0.0.0.0"
autoindex = true
file_open = [
    "/php/demo.php=preview",
    "pdf=preview",
    "zip=download",
    "php=execute",
]
http_versions = [
    "h1",
    "h2",
]
port = 9095
root = "www-apps"
server_name = "apps.crucible.local"

[[listeners.apps]]
docroot = "www-apps/php"
enabled = true
engine = "php"
extensions = [
    "php",
    "",
]
index = "index.php"
paths = ["/php"]
workers = 16

