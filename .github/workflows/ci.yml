name: CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Strip
        run: strip --strip-all target/x86_64-unknown-linux-musl/release/webserver

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crucible-static
          path: target/x86_64-unknown-linux-musl/release/webserver

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: crucible-static
          path: ./bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/webserver
          tag_name: latest
          name: latest
          overwrite: true
