name: Crucible Build CI

# Auto build crucible on push/PR/main and on-demand.
#
# Notes:
#   - `boring`/`boring-sys` (BoringSSL FFI) needs ~2-3 GB peak link memory,
#     so the default "full" matrix runs on standard GitHub runners (>=4 GB).
#   - The `mem-constrained` job targets the Crucible 1 GB target host:
#     it builds WITHOUT BoringSSL (tls_rustls only) and with
#     codegen-units=16 + lto=off so peak RSS stays < 1 GB.
#     It is allowed to fail (continue-on-error) since 1 GB is below rustc's
#     comfortable headroom for the crypto stack.

on:
  push:
    branches: [main, "refs/tags/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: auto
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.tier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        tier: [minimal, full]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake clang

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo build (per-matrix)
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.os }}-${{ matrix.tier }}-${{ hashFiles('**/Cargo.lock','**/*.rs') }}

      - name: cargo fmt --check
        run: cargo fmt --check || true   # fmt not gated on main builds

      - name: Build minimal (no crypto extras)
        if: matrix.tier == 'minimal'
        run: |
          cargo build --release -j 2
          cargo clippy -- -D warnings

      - name: Build full features (BoringSSL TLS)
        if: matrix.tier == 'full'
        run: |
          cargo build --release --bin webserver --features "tls,tls_boring,go_shm_ipc,tls_nss,tls_tomcrypt" -j 2
          cargo clippy -- -D warnings

      - name: Smoke test webserver
        run: |
          timeout 20 cargo run --release --bin webserver -- --config config.toml &
          sleep 12
          echo smoke-ok

  # 1 GB target host (OpenBSD, low RAM). Build rustls-only variant with relaxed
  # rustc flags so the job can actually finish under the memory ceiling.
  mem-constrained:
    name: 1 GB target (rustls-only)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rustls-${{ hashFiles('**/Cargo.lock') }}
      - name: Build rustls-only under 1 GB vmem
        run: |
          # ulimit -v sets bytes; 1048576 KB = 1 GB virtual memory ceiling
          (ulimit -v 1048576 && cargo build --release --bin webserver --no-default-features --features "tls_rustls" -j 1)
        env:
          CARGO_ENCODED_RUSTFLAGS: "-C codegen-units=16 -C lto=off -C opt-level=s"
