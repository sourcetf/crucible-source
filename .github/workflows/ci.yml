name: Crucible Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: auto

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.tier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        tier: [minimal, full]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (ubuntu)
        if: matrix.os == "ubuntu-22.04"
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev cmake clang

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles("**/Cargo.lock") }}

      - name: Format check
        run: cargo fmt --check

      - name: Build minimal
        if: matrix.tier == "minimal"
        run: |
          cargo build --release -j 2
          cargo clippy -- -D warnings

      - name: Build full features
        if: matrix.tier == "full"
        run: |
          cargo build --release --bin webserver --features "tls,tls_boring,go_shm_ipc,tls_nss,tls_tomcrypt" -j 2
          cargo clippy -- -D warnings

      - name: Smoke test
        run: |
          timeout 25 cargo run --release --bin webserver -- --config config.toml &
          sleep 15
          echo smoke-done

  oom-mem-constrained:
    name: 1GB memory build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-oom-${{ hashFiles("**/Cargo.lock") }}
      - name: Build with ulimit 1GB virtual memory
        run: |
          ulimit -v 1048576
          cargo build --release -j 1 --features "tls,tls_boring"
        continue-on-error: true
