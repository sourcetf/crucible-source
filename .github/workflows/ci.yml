name: CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  build_musl:
    runs-on: ubuntu-22.04
    container:
      image: rust:1.82.0-alpine
      options: --user root
    steps:
      - name: Install alpine build deps (musl + static)
        run: |
          apk add --no-cache musl-dev musl-utils cargo-static git make g++ perl

      - uses: actions/checkout@v4

      - name: Install rustup target
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup component add clippy

      - name: Build static binary (musl libc)
        run: |
          cargo build --release --target ${{ env.TARGET }}

      - name: Strip binary
        run: |
          strip target/x86_64-unknown-linux-musl/release/webserver

      - name: Verify static
        run: |
          file target/x86_64-unknown-linux-musl/release/webserver

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crucible-static
          path: target/x86_64-unknown-linux-musl/release/webserver

  release:
    needs: build_musl
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: crucible-static
          path: ./bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/webserver
          tag_name: latest
          name: latest
          overwrite: true
